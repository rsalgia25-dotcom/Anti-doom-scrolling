<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curated Nightly Dashboard</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151f32;
      --text: #cbd5e1;
      --heading: #f8fafc;
      --accent: #38bdf8;
      --youtube: #ef4444;
      --reddit: #f97316;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 15px;
      line-height: 1.5;
    }
    .container { max-width: 1200px; margin: 0 auto; padding-bottom: 60px; }
    
    .top-bar {
      position: sticky;
      top: 0;
      background: rgba(11, 15, 25, 0.95);
      backdrop-filter: blur(8px);
      padding: 10px 0;
      z-index: 100;
      border-bottom: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }
    .top-bar h1 { font-size: 1.2rem; color: var(--heading); margin: 0; }
    .timer-box {
      background: #111827;
      border: 1px solid #10b981;
      color: #10b981;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-family: monospace;
      font-size: 1.1rem;
    }

    .physics-panel {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border-left: 5px solid var(--accent);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 30px;
    }
    .physics-panel h3 { margin-top: 0; color: var(--accent); font-size: 1.1rem; margin-bottom: 8px; }
    .physics-text { font-size: 1.1rem; color: var(--heading); font-weight: 500; }
    
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 850px) { .dashboard-grid { grid-template-columns: 1fr; } }
    
    .feed-column {
      background-color: var(--card);
      border-radius: 12px;
      padding: 20px;
    }
    .feed-column h2 { 
      color: var(--heading); 
      border-bottom: 2px solid #1e293b; 
      padding-bottom: 10px; 
      margin-top: 0;
      font-size: 1.3rem;
    }
    
    .content-card {
      background: #1e293b;
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 14px;
    }
    .content-card a { color: var(--heading); text-decoration: none; font-weight: 600; font-size: 1rem; display: block; margin-bottom: 6px; }
    .content-card a:hover { color: var(--accent); }
    
    .meta-row { display: flex; gap: 10px; align-items: center; font-size: 0.8rem; color: #94a3b8; }
    .tag {
      padding: 2px 6px;
      border-radius: 4px;
      color: #fff;
      font-weight: bold;
      font-size: 0.7rem;
    }
    .tag-yt { background-color: var(--youtube); }
    .tag-rd { background-color: var(--reddit); }
    .loading { color: #64748b; font-style: italic; padding: 10px; font-size: 0.9rem; }

    #lockout-screen {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #070a12;
      z-index: 9999;
      color: #ef4444;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    #lockout-screen h2 { font-size: 2rem; margin-bottom: 10px; }
    #lockout-screen p { color: #94a3b8; font-size: 1.2rem; }
  </style>
</head>
<body>

  <div id="lockout-screen">
    <h2>⏰ Time's Up!</h2>
    <p>Your 30 minutes are over. Put the phone away and get some sleep.</p>
  </div>

  <div class="container" id="main-content">
    <div class="top-bar">
      <h1>🌙 Wind-Down Hub</h1>
      <div class="timer-box" id="countdown-timer">30:00</div>
    </div>

    <section class="physics-panel">
      <h3>🌌 Tonight's Physics Spark</h3>
      <div class="physics-text" id="physics-fact">Loading anomaly panel...</div>
    </section>

    <main class="dashboard-grid">
      <div class="feed-column">
        <h2>📺 Video Channels (Last 48 Hours)</h2>
        <div id="youtube-feed"><div class="loading">Searching creators...</div></div>
      </div>

      <div class="feed-column">
        <h2>🧡 Subreddit Pulses (Top Hot)</h2>
        <div id="reddit-feed"><div class="loading">Searching local nodes...</div></div>
      </div>
    </main>
  </div>

  <script>
    // 1. ABSOLUTE DIRECT TIMER LOOP
    var totalSeconds = 1800;
    var timerBox = document.getElementById('countdown-timer');
    var overlay = document.getElementById('lockout-screen');

    function tick() {
      if (totalSeconds < 0) return;
      var m = Math.floor(totalSeconds / 60);
      var s = totalSeconds % 60;
      
      var mStr = (m < 10) ? '0' + m : '' + m;
      var sStr = (s < 10) ? '0' + s : '' + s;

      timerBox.innerText = mStr + ':' + sStr;

      // Safe fallback inline styling to avoid DOM root calculation blocks
      if (totalSeconds <= 300) {
        timerBox.style.color = '#ef4444';
        timerBox.style.borderColor = '#ef4444';
      }
      if (totalSeconds === 0) {
        overlay.style.display = 'flex';
      }
      totalSeconds--;
    }
    setInterval(tick, 1000);

    // 2. TIMEOUT-PROOF STATIC PHYSICS spark entries
    var deepPhysicsFacts = [
      "Time passes slower at your feet than at your head because gravity warps spacetime. Einstein's General Relativity proves you are micro-seconds younger at your ankles!",
      "Quantum Tunneling allows particles to pass through solid, impenetrable barriers. Without this subatomic layout quirk, our Sun couldn't fuse hydrogen, and life wouldn't exist.",
      "The Cosmic Microwave Background is the literal afterglow of the Big Bang, filling all space. Roughly 1% of ancient analog TV static is interference from the birth of the universe.",
      "A single teaspoon of a Neutron Star would weigh roughly 6 billion tons on Earth. They are the collapsed iron cores of supergiant stars compressed down to the size of a single city.",
      "Entangled particles mirror each other instantly across light-years. Einstein called this 'spooky action at a distance', where changing one immediately dictates the state of its paired twin."
    ];

    function showFact() {
      var d = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / 86400000);
      var idx = d % deepPhysicsFacts.length;
      document.getElementById('physics-fact').innerText = deepPhysicsFacts[idx];
    }
    showFact();

    // 3. SECURE REDDIT LOADER
    function runReddit() {
      var subs = ['thane', 'mumbai', 'StockMarketIndia'];
      var box = document.getElementById('reddit-feed');
      box.innerHTML = '';

      subs.forEach(function(subName) {
        var u = 'https://reddit.com' + subName + '/hot.json?limit=4';
        fetch('https://allorigins.win' + encodeURIComponent(u))
          .then(function(r) { return r.json(); })
          .then(function(j) {
            var parsed = JSON.parse(j.contents);
            if (!parsed || !parsed.data || !parsed.data.children) return;
            var items = parsed.data.children;
            
            items.forEach(function(item) {
              if (item.data.stickied) return;
              var el = document.createElement('div');
              el.className = 'content-card';
              
              var cardInner = '<div class="meta-row" style="margin-bottom:6px;">';
              cardInner += '<span class="tag tag-rd">r/' + subName + '</span>';
              cardInner += '<span>👤 ' + item.data.author + '</span></div>';
              cardInner += '<a href="https://reddit.com' + item.data.permalink + '" target="_blank">' + item.data.title + '</a>';
              
              el.innerHTML = cardInner;
              box.appendChild(el);
            });
          })
          .catch(function(err) { console.log(err); });
      });
    }

    // 4. CLEAN JSON-BASED YOUTUBE PARSER
    function runYouTube() {
      var channels = [
        { name: 'Markets With Jayant', cid: 'UCP_W8ZpS9Yg8P_h2n2v0j_g' },
        { name: 'Peek TV', cid: 'UCvXU-vS_Zc8mH_mP7fOnw8A' },
        { name: 'Cleo Abram', cid: 'UC-Sg5EdfH9WpXFYG_Z_Mwtw' },
        { name: 'Spiritualbee', cid: 'UCCf_p-O7Xid4p_TbygHofHw' },
        { name: 'PowerTrain', cid: 'UC6z836F8y4gXp_qJ4t-Nq7Q' },
        { name: 'Mohak Mangal', cid: 'UC7O0_K878C3L9nZcda56G_A' },
        { name: 'Vox', cid: 'UC3xtz7vX_hIFNVyWhp07BfA' }
      ];

      var box = document.getElementById('youtube-feed');
      box.innerHTML = '';
      var tsNow = new Date().getTime();
      var maxAge = 48 * 60 * 60 * 1000;
      var found = 0;

      channels.forEach(function(ch) {
        var u = 'https://youtube.com' + ch.cid;
        fetch('https://rss2json.com' + encodeURIComponent(u))
          .then(function(r) { return r.json(); })
          .then(function(j) {
            if (j && j.status === 'ok' && j.items && j.items.length > 0) {
              for (var i = 0; i < Math.min(j.items.length, 3); i++) {
                var vid = j.items[i];
                var cleanDateStr = vid.pubDate.replace(/-/g, "/");
                var vTs = new Date(cleanDateStr).getTime();
                
                if ((tsNow - vTs) <= maxAge) {
                  found++;
                  var el = document.createElement('div');
                  el.className = 'content-card';
                  
                  var ytInner = '<div class="meta-row" style="margin-bottom:6px;">';
                  ytInner += '<span class="tag tag-yt">' + ch.name + '</span>';
                  ytInner += '<span style="color:#38bdf8; font-size:11px;">● Last 48h</span></div>';
                  ytInner += '<a href="' + vid.link + '" target="_blank">' + vid.title + '</a>';
                  
                  el.innerHTML = ytInner;
                  box.appendChild(el);
                }
              }
            }
          })
